<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minhas Tarefas</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <button class="botao-menu">
        ☰
    </button>

    <aside class="menu-lateral">

        <div class="cabecalho-menu">
            <h2>Minhas tarefas</h2>
            <button class="fechar-menu">
                ×
            </button>

        </div>

        <button class="nova-tarefa">
            + Nova tarefa
        </button>

        <div class="area-formulario"></div>
        <div class="lista-Tarefas">
            <h3 class="titulo-lista"></h3>
        </div>
        <div class="opcoes-menu">

    <button class="botao-concluidas">
        ✓ Tarefas concluídas
    </button>

    <button class="botao-modo-escuro">
        🌙 Modo escuro
    </button>

</div>

    </aside>


<main class="conteudo">

    <div class="mensagem-inicial">
        <h1>Olá! 🌱</h1>
        <p>
            Clique no menu para adicionar ou visualizar tarefas.
        </p>
    </div>
    <div class="detalhes-tarefa"></div>

</main>


    <script src="script.js"></script>

</body>

</html>
